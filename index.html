<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>My Portfolio | Web Developer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050508;
  --surface:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);
  --accent:#4f8eff;
  --accent2:#a78bfa;
  --text:#e8e8f0;
  --muted:#8a8aa0;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  background:transparent;
  overflow-x:hidden;
  min-height:100vh;
}

/* =========================
   VIDEO BACKGROUND
========================= */

.video-bg{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
}

.video-bg video{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(0.4) blur(2px);
  transform:scale(1.05);
}

.video-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:-4;
}

/* =========================
   ANIMATED ORBS
========================= */

.bg-orbs{
  position:fixed;
  inset:0;
  z-index:-3;
  overflow:hidden;
  pointer-events:none;
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.15;
  animation:drift 18s infinite alternate ease-in-out;
}

.orb-1{
  width:500px;
  height:500px;
  background:#4f8eff;
  top:-150px;
  left:-100px;
}

.orb-2{
  width:400px;
  height:400px;
  background:#a78bfa;
  bottom:-120px;
  right:-80px;
}

.orb-3{
  width:300px;
  height:300px;
  background:#34d399;
  top:40%;
  left:40%;
}

@keyframes drift{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(50px,-40px);
  }
}

/* =========================
   GRID OVERLAY
========================= */

.bg-grid{
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:60px 60px;
}

/* =========================
   PAGE
========================= */

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px 20px;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:700px;
}

.status-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:999px;
  background:rgba(52,211,153,0.1);
  border:1px solid rgba(52,211,153,0.25);
  color:#34d399;
  font-size:0.85rem;
  margin-bottom:28px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#34d399;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.4;
  }
}

.avatar-wrap{
  position:relative;
  width:130px;
  height:130px;
  margin:0 auto 28px;
}

.avatar-wrap::before{
  content:'';
  position:absolute;
  inset:-5px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  animation:spin 8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.avatar-wrap img{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #050508;
  z-index:2;
}

.hero-tag{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  background:rgba(79,142,255,0.1);
  border:1px solid rgba(79,142,255,0.25);
  color:var(--accent);
  font-size:0.8rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:20px;
}

.hero-name{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.5rem,7vw,5rem);
  line-height:1;
  font-weight:800;
  margin-bottom:18px;
  background:linear-gradient(135deg,#fff,#9ca3af);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-bio{
  color:var(--muted);
  line-height:1.8;
  max-width:600px;
  margin:0 auto 35px;
  font-size:1rem;
}

/* =========================
   BUTTONS
========================= */

.hero-nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  margin-bottom:35px;
}

.btn-primary,
.btn-ghost{
  padding:14px 28px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-family:'Syne',sans-serif;
  font-weight:700;
  transition:.3s ease;
  font-size:.9rem;
}

.btn-primary{
  background:linear-gradient(135deg,var(--accent),#6b8cff);
  color:white;
  box-shadow:0 10px 30px rgba(79,142,255,0.35);
}

.btn-primary:hover{
  transform:translateY(-3px);
}

.btn-ghost{
  background:rgba(255,255,255,0.04);
  color:white;
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.btn-ghost:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-3px);
}

/* =========================
   SOCIALS
========================= */

.socials{
  display:flex;
  justify-content:center;
  gap:14px;
}

.social-link{
  width:46px;
  height:46px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  text-decoration:none;
  transition:.3s ease;
  backdrop-filter:blur(10px);
}

.social-link:hover{
  transform:translateY(-4px);
  border-color:var(--accent);
  color:var(--accent);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .hero-nav{
    flex-direction:column;
  }

  .btn-primary,
  .btn-ghost{
    width:100%;
  }

}
</style>
</head>

<body>

<!-- =========================
     VIDEO BACKGROUND
========================= -->

<div class="video-bg">
  <video autoplay muted loop playsinline>
    <source src="Jun Kazama.mp4" type="video/mp4">
  </video>
</div>

<div class="video-overlay"></div>

<!-- =========================
     ORBS
========================= -->

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="bg-grid"></div>

<!-- =========================
     HOME
========================= -->

<section class="page">

  <div class="hero">

    <div class="status-badge">
      <span class="status-dot"></span>
      Available for opportunities
    </div>

    <div class="avatar-wrap">
      <img src="profile.jpg" alt="Profile">
    </div>

    <div class="hero-tag">
      Web Developer
    </div>

    <h1 class="hero-name">
      Khelvin John Javone
    </h1>

    <p class="hero-bio">
      Front-end developer passionate about building responsive and
      high-performance web experiences using modern technologies.
      I focus on clean code, smooth UI, and real-world usability.
    </p>

    <div class="hero-nav">
      <button class="btn-primary">
        <i class="fas fa-folder-open"></i>
        View Projects
      </button>

      <button class="btn-ghost">
        <i class="fas fa-file-alt"></i>
        Resume
      </button>

      <button class="btn-ghost">
        <i class="fas fa-paper-plane"></i>
        Contact
      </button>
    </div>

    <div class="socials">

      <a href="https://www.linkedin.com/in/khelvin-john-javone-b3288a406"
         target="_blank"
         class="social-link">
        <i class="fab fa-linkedin-in"></i>
      </a>

      <a href="https://github.com/Dezzwoo"
         target="_blank"
         class="social-link">
        <i class="fab fa-github"></i>
      </a>

      <a href="https://www.facebook.com/ryuki.kakero"
         target="_blank"
         class="social-link">
        <i class="fab fa-facebook-f"></i>
      </a>

      <a href="https://www.tiktok.com/@dezzwoogaming"
         target="_blank"
         class="social-link">
        <i class="fab fa-tiktok"></i>
      </a>

    </div>

  </div>

</section>

</body>
</html>
